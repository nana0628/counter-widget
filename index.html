<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Karaoke Counter Compact</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="container">
		<div class="count-section">
			<span id="count" class="count">1</span>
			<span class="unit">曲目</span>
		</div>
		
		<div class="controls">
			<button class="op-btn" onclick="changeCount(1)">＋</button>
			<button class="op-btn" onclick="changeCount(-1)">－</button>
		</div>
		
		<div class="reset-section">
			<button class="reset-btn" onclick="resetCount()">リセット</button>
		</div>
	</div>
	<script src="script.js"></script>
</body>
</html>
